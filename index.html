<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Секретная комната</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Comic Sans MS', 'Arial', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
    overflow: hidden;
  }

  h1 {
    color: #ffd700;
    font-size: 36px;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px #000;
  }

  .hint {
    color: #fff;
    font-size: 20px;
    margin-bottom: 15px;
    background: rgba(0,0,0,0.4);
    padding: 8px 18px;
    border-radius: 20px;
  }

  .stage {
    position: relative;
    width: 700px;
    height: 450px;
    background: #2b2b3d;
    border: 6px solid #5a4a2a;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
  }

  /* Пол и стены комнаты */
  .floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 80px;
    background: repeating-linear-gradient(
      90deg,
      #6b4423 0px, #6b4423 40px,
      #8b5a2b 40px, #8b5a2b 80px
    );
  }

  /* Дверь */
  .door {
    position: absolute;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    width: 180px;
    height: 300px;
    background: linear-gradient(90deg, #5d3a1a 0%, #8b5a2b 50%, #5d3a1a 100%);
    border: 5px solid #3a2410;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    transform-origin: left center;
    transition: transform 1.5s ease-in-out;
    z-index: 5;
  }

  .door::before {
    content: '';
    position: absolute;
    top: 40px; left: 20px; right: 20px;
    height: 100px;
    background: #3a2410;
    border-radius: 4px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  .door::after {
    content: '';
    position: absolute;
    top: 160px; left: 20px; right: 20px;
    height: 100px;
    background: #3a2410;
    border-radius: 4px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  .handle {
    position: absolute;
    right: 20px;
    top: 50%;
    width: 18px;
    height: 18px;
    background: radial-gradient(circle, #ffd700, #b8860b);
    border-radius: 50%;
    box-shadow: 0 0 8px #ffd700;
  }

  .door.open {
    transform: translateX(-50%) perspective(800px) rotateY(-85deg);
  }

  /* Ключ */
  .key {
    position: absolute;
    left: 60px;
    bottom: 110px;
    font-size: 40px;
    cursor: pointer;
    transition: all 0.5s ease;
    animation: shine 2s infinite;
    z-index: 10;
    filter: drop-shadow(0 0 8px #ffd700);
  }

  .key:hover {
    transform: scale(1.3) rotate(20deg);
  }

  .key.found {
    opacity: 0;
    transform: scale(0) rotate(720deg);
    pointer-events: none;
  }

  @keyframes shine {
    0%, 100% { filter: drop-shadow(0 0 8px #ffd700); }
    50% { filter: drop-shadow(0 0 20px #fff700); }
  }

  /* Индикатор ключа */
  .key-status {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 8px 14px;
    border-radius: 15px;
    font-size: 16px;
    z-index: 20;
  }

  .key-status.found {
    background: #4caf50;
    color: #fff;
  }

  /* Сообщение */
  .message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #ff6b6b;
    color: white;
    padding: 20px 30px;
    border-radius: 20px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
    z-index: 30;
    transition: transform 0.3s ease;
    border: 3px solid #fff;
  }

  .message.show {
    transform: translate(-50%, -50%) scale(1);
  }

  .message.success {
    background: #4caf50;
    box-shadow: 0 0 20px rgba(0,255,0,0.5);
  }

  /* Мир за дверью */
  .world {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 380px;
    background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 60%, #90ee90 60%, #228b22 100%);
    z-index: 2;
    opacity: 0;
    transition: opacity 1s ease;
    overflow: hidden;
  }

  .world.visible {
    opacity: 1;
  }

  .sun {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #fff700, #ffa500);
    border-radius: 50%;
    box-shadow: 0 0 30px #fff700;
  }

  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
  }

  .cloud1 {
    top: 30px; left: 10px;
    width: 50px; height: 18px;
  }

  .cloud2 {
    top: 60px; right: 10px;
    width: 40px; height: 14px;
  }

  .tree {
    position: absolute;
    bottom: 0;
    width: 40px;
    height: 100px;
  }

  .tree-trunk {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 30px;
    background: #6b4423;
  }

  .tree-top {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 35px;
    height: 50px;
    background: radial-gradient(circle, #228b22, #006400);
    border-radius: 50%;
  }

  .tree1 { left: 10px; }
  .tree2 { right: 10px; }

  .flower {
    position: absolute;
    bottom: 10px;
    font-size: 20px;
  }

  .flower1 { left: 55px; }
  .flower2 { left: 95px; }
  .flower3 { left: 135px; }

  .robot {
    position: absolute;
    bottom: 30px;
    font-size: 35px;
    animation: bounce 1.5s infinite;
  }

  .robot1 { left: 30px; animation-delay: 0s; }
  .robot2 { right: 30px; animation-delay: 0.7s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Кнопка сброса */
  .reset {
    margin-top: 20px;
    padding: 10px 25px;
    font-size: 18px;
    background: #ffd700;
    border: 3px solid #b8860b;
    border-radius: 25px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    transition: transform 0.2s, background 0.3s, color 0.3s;
  }

  .reset:hover {
    transform: scale(1.05);
  }

  /* Состояние "нажата" — меняет цвет */
  .reset.pressed {
    background: #4caf50;
    border-color: #2e7d32;
    color: #fff;
  }
</style>
</head>
<body>

<h1>🔐 Секретная комната 🔐</h1>
<div class="hint">Найди ключ и открой дверь!</div>

<div class="stage" id="stage">
  <!-- Индикатор ключа -->
  <div class="key-status" id="keyStatus">🔑 Ключ: не найден</div>

  <!-- Мир за дверью -->
  <div class="world" id="world">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="tree tree1">
      <div class="tree-top"></div>
      <div class="tree-trunk"></div>
    </div>
    <div class="tree tree2">
      <div class="tree-top"></div>
      <div class="tree-trunk"></div>
    </div>
    <div class="flower flower1">🌷</div>
    <div class="flower flower2">🌻</div>
    <div class="flower flower3">🌹</div>
    <div class="robot robot1">🤖</div>
    <div class="robot robot2">🤖</div>
  </div>

  <!-- Дверь -->
  <div class="door" id="door">
    <div class="handle"></div>
  </div>

  <!-- Ключ -->
  <div class="key" id="key">🔑</div>

  <!-- Сообщение -->
  <div class="message" id="message"></div>

  <div class="floor"></div>
</div>

<button class="reset" id="resetBtn" onclick="handleReset()">🔄 Начать заново</button>

<script>
  let keyFound = false;
  let doorOpen = false;

  const key = document.getElementById('key');
  const door = document.getElementById('door');
  const message = document.getElementById('message');
  const keyStatus = document.getElementById('keyStatus');
  const world = document.getElementById('world');
  const resetBtn = document.getElementById('resetBtn');

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message show' + (type === 'success' ? ' success' : '');
    setTimeout(() => {
      message.classList.remove('show');
    }, 2000);
  }

  key.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!keyFound) {
      keyFound = true;
      key.classList.add('found');
      keyStatus.textContent = '🔑 Ключ: найден!';
      keyStatus.classList.add('found');
      showMessage('✨ Ключ найден! Теперь открой дверь!', 'success');
    }
  });

  door.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!keyFound) {
      // Правило 1: ЕСЛИ ключ не найден → дверь не открывается
      showMessage('Упс! Найди сначала ключ 🔍');
    } else if (!doorOpen) {
      // Правило 2: ЕСЛИ ключ найден И дверь закрыта → дверь открыта
      doorOpen = true;
      door.classList.add('open');
      world.classList.add('visible');
      showMessage('🎉 Ура! Добро пожаловать в волшебный мир!', 'success');
    }
  });

  // Обработка кнопки "Начать заново": меняет цвет при нажатии
  function handleReset() {
    resetBtn.classList.add('pressed');
    resetGame();
  }

  function resetGame() {
    keyFound = false;
    doorOpen = false;
    key.classList.remove('found');
    door.classList.remove('open');
    world.classList.remove('visible');
    keyStatus.textContent = '🔑 Ключ: не найден';
    keyStatus.classList.remove('found');
    message.classList.remove('show');
    resetBtn.classList.remove('pressed');
  }
</script>

</body>
</html>
